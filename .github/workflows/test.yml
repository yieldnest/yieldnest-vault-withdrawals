name: CI

on:
  push:
    branches:
      - main
      - release-candidate
  pull_request:
  workflow_dispatch:

env:
  ETH_MAINNET_RPC_URL: ${{ secrets.ETH_MAINNET_RPC_URL }}

permissions:
  contents: read

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.6.0-rc1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        run: forge build

      - name: Run Forge unit tests
        env:
          FOUNDRY_PROFILE: default
        run: forge test -vvv

      - name: Run Forge mainnet tests
        env:
          FOUNDRY_PROFILE: mainnet
        run: forge test -vvv
